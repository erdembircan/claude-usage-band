" bpmnElement=\"Start_session\"><dc:Bounds x=\"602\" y=\"207\" width=\"36\" height=\"36\"/><bpmndi:BPMNLabel><dc:Bounds x=\"646\" y=\"205\" width=\"120\" height=\"40\"/><\/bpmndi:BPMNLabel><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"Start_measure_di\" bpmnElement=\"Start_measure\"><dc:Bounds x=\"802\" y=\"207\" width=\"36\" height=\"36\"/><bpmndi:BPMNLabel><dc:Bounds x=\"846\" y=\"205\" width=\"120\" height=\"40\"/><\/bpmndi:BPMNLabel><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"Start_tick_di\" bpmnElement=\"Start_tick\"><dc:Bounds x=\"1162\" y=\"317\" width=\"36\" height=\"36\"/><bpmndi:BPMNLabel><dc:Bounds x=\"1206\" y=\"315\" width=\"120\" height=\"40\"/><\/bpmndi:BPMNLabel><\/bpmndi:BPMNShape><bpmndi:BPMNEdge id=\"DataOut_1_di\" bpmnElement=\"DataOut_1\"><di:waypoint x=\"320\" y=\"480\"/><di:waypoint x=\"360\" y=\"520\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNShape id=\"Task_toggle_di\" bpmnElement=\"Task_toggle\"><dc:Bounds x=\"205\" y=\"400\" width=\"150\" height=\"80\"/><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"Task_start_di\" bpmnElement=\"Task_start\"><dc:Bounds x=\"545\" y=\"400\" width=\"150\" height=\"80\"/><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"Task_measure_di\" bpmnElement=\"Task_measure\"><dc:Bounds x=\"745\" y=\"400\" width=\"150\" height=\"80\"/><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"Gw_differ_di\" bpmnElement=\"Gw_differ\"><dc:Bounds x=\"695\" y=\"545\" width=\"50\" height=\"50\"/><bpmndi:BPMNLabel><dc:Bounds x=\"575\" y=\"550\" width=\"115\" height=\"40\"/><\/bpmndi:BPMNLabel><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"End_same_di\" bpmnElement=\"End_same\"><dc:Bounds x=\"882\" y=\"552\" width=\"36\" height=\"36\"/><bpmndi:BPMNLabel><dc:Bounds x=\"855\" y=\"592\" width=\"90\" height=\"27\"/><\/bpmndi:BPMNLabel><\/bpmndi:BPMNShape><bpmndi:BPMNEdge id=\"DataOut_2_di\" bpmnElement=\"DataOut_2\"><di:waypoint x=\"795\" y=\"690\"/><di:waypoint x=\"875\" y=\"690\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNShape id=\"Task_keep_di\" bpmnElement=\"Task_keep\"><dc:Bounds x=\"645\" y=\"650\" width=\"150\" height=\"80\"/><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"Job_toggle_di\" bpmnElement=\"Job_toggle\"><dc:Bounds x=\"205\" y=\"810\" width=\"150\" height=\"80\"/><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"Job_figures_di\" bpmnElement=\"Job_figures\"><dc:Bounds x=\"645\" y=\"810\" width=\"150\" height=\"80\"/><\/bpmndi:BPMNShape><bpmndi:BPMNEdge id=\"DataIn_3_di\" bpmnElement=\"DataIn_3\"><di:waypoint x=\"925\" y=\"690\"/><di:waypoint x=\"1140\" y=\"690\"/><di:waypoint x=\"1140\" y=\"810\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNShape id=\"Job_clock_di\" bpmnElement=\"Job_clock\"><dc:Bounds x=\"1105\" y=\"810\" width=\"150\" height=\"80\"/><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"End_redraw_di\" bpmnElement=\"End_redraw\"><dc:Bounds x=\"1602\" y=\"942\" width=\"36\" height=\"36\"/><bpmndi:BPMNLabel><dc:Bounds x=\"1575\" y=\"982\" width=\"90\" height=\"14\"/><\/bpmndi:BPMNLabel><\/bpmndi:BPMNShape><bpmndi:BPMNEdge id=\"Flow_5_di\" bpmnElement=\"Flow_5\"><di:waypoint x=\"280\" y=\"118\"/><di:waypoint x=\"280\" y=\"400\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_6_di\" bpmnElement=\"Flow_6\"><di:waypoint x=\"620\" y=\"243\"/><di:waypoint x=\"620\" y=\"400\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_7_di\" bpmnElement=\"Flow_7\"><di:waypoint x=\"820\" y=\"243\"/><di:waypoint x=\"820\" y=\"400\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_8_di\" bpmnElement=\"Flow_8\"><di:waypoint x=\"620\" y=\"480\"/><di:waypoint x=\"620\" y=\"520\"/><di:waypoint x=\"720\" y=\"520\"/><di:waypoint x=\"720\" y=\"545\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_9_di\" bpmnElement=\"Flow_9\"><di:waypoint x=\"820\" y=\"480\"/><di:waypoint x=\"820\" y=\"520\"/><di:waypoint x=\"720\" y=\"520\"/><di:waypoint x=\"720\" y=\"545\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_10_di\" bpmnElement=\"Flow_10\"><di:waypoint x=\"745\" y=\"570\"/><di:waypoint x=\"882\" y=\"570\"/><bpmndi:BPMNLabel><dc:Bounds x=\"765\" y=\"550\" width=\"14\" height=\"14\"/><\/bpmndi:BPMNLabel><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_11_di\" bpmnElement=\"Flow_11\"><di:waypoint x=\"720\" y=\"595\"/><di:waypoint x=\"720\" y=\"650\"/><bpmndi:BPMNLabel><dc:Bounds x=\"728\" y=\"610\" width=\"20\" height=\"14\"/><\/bpmndi:BPMNLabel><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_12_di\" bpmnElement=\"Flow_12\"><di:waypoint x=\"280\" y=\"480\"/><di:waypoint x=\"280\" y=\"810\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_13_di\" bpmnElement=\"Flow_13\"><di:waypoint x=\"720\" y=\"730\"/><di:waypoint x=\"720\" y=\"810\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_14_di\" bpmnElement=\"Flow_14\"><di:waypoint x=\"1180\" y=\"353\"/><di:waypoint x=\"1180\" y=\"810\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_15_di\" bpmnElement=\"Flow_15\"><di:waypoint x=\"280\" y=\"890\"/><di:waypoint x=\"280\" y=\"960\"/><di:waypoint x=\"1602\" y=\"960\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_16_di\" bpmnElement=\"Flow_16\"><di:waypoint x=\"720\" y=\"890\"/><di:waypoint x=\"720\" y=\"960\"/><di:waypoint x=\"1602\" y=\"960\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNEdge id=\"Flow_17_di\" bpmnElement=\"Flow_17\"><di:waypoint x=\"1180\" y=\"890\"/><di:waypoint x=\"1180\" y=\"960\"/><di:waypoint x=\"1602\" y=\"960\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNShape id=\"Note_figures_di\" bpmnElement=\"Note_figures\"><dc:Bounds x=\"830\" y=\"820\" width=\"240\" height=\"60\"/><\/bpmndi:BPMNShape><bpmndi:BPMNEdge id=\"Association_18_di\" bpmnElement=\"Association_18\"><di:waypoint x=\"795\" y=\"850\"/><di:waypoint x=\"830\" y=\"850\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNShape id=\"Note_clock_di\" bpmnElement=\"Note_clock\"><dc:Bounds x=\"1290\" y=\"790\" width=\"270\" height=\"120\"/><\/bpmndi:BPMNShape><bpmndi:BPMNEdge id=\"Association_19_di\" bpmnElement=\"Association_19\"><di:waypoint x=\"1255\" y=\"850\"/><di:waypoint x=\"1290\" y=\"850\"/><\/bpmndi:BPMNEdge><bpmndi:BPMNShape id=\"Participant_di\" bpmnElement=\"Participant\" isHorizontal=\"true\"><dc:Bounds x=\"150\" y=\"40\" width=\"1530\" height=\"1040\"/><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"Lane_you_di\" bpmnElement=\"Lane_you\" isHorizontal=\"true\"><dc:Bounds x=\"180\" y=\"40\" width=\"1500\" height=\"120\"/><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"Lane_engine_di\" bpmnElement=\"Lane_engine\" isHorizontal=\"true\"><dc:Bounds x=\"180\" y=\"160\" width=\"1500\" height=\"120\"/><\/bpmndi:BPMNShape><bpmndi:BPMNShape id=\"Lane_mod_di\" bpmnElement=\"Lane_mod\" isHorizontal=\"true\"><dc:Bounds x=\"180\" y=\"280\" width=\"1500\" height=\"800\"/><\/bpmndi:BPMNShape><\/bpmndi:BPMNPlane><\/bpmndi:BPMNDiagram>\n<\/bpmn:definitions>\n"};
  const viewers = [];
  const fit = viewer => {
    try {
      viewer.get('canvas').zoom('fit-viewport', 'auto');
    } catch (error) {
      // The canvas has no size yet (a hidden tab): it is fitted on the next resize.
    }
  };
  for (const [id, xml] of Object.entries(diagrams)) {
    const viewer = new BpmnJS({ container: '#' + id });
    viewers.push(viewer);
    viewer.importXML(xml).then(({ warnings }) => {
      if (warnings.length) console.warn(id, warnings);
      requestAnimationFrame(() => fit(viewer));
    }).catch(error => console.error(id, error));
  }
  window.viewers = viewers;
  window.addEventListener('resize', () => viewers.forEach(fit));
